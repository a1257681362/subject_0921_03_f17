# 测试环境：内存 H2，隔离开发文件库；代理退避参数缩短以便快速验证重试
spring:
  autoconfigure:
    exclude:
      # 与主配置一致：该 APC 注册 JDK 动态代理会使具体 Service 注入失败
      - org.apache.shiro.spring.boot.autoconfigure.ShiroAnnotationProcessorAutoConfiguration
  datasource:
    url: jdbc:h2:mem:agent-test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # 与主配置一致：Flyway 管版本（新库 V1->V2 完整执行），旧 schema.sql 并跑空转
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

evops:
  auth:
    secret: test-jwt-secret-key-must-be-at-least-32-bytes-long
  agent:
    enabled: true
    endpoint: http://127.0.0.1:9/agent-stub/ticket
    max-retry: 2
    base-backoff-seconds: 1
    max-backoff-seconds: 2
    connect-timeout-ms: 1000
    read-timeout-ms: 1000
  notify:
    enabled: true
    inbox-enabled: true
    email-enabled: true
    email-endpoint: http://127.0.0.1:9/mail-stub/send
    max-retry: 2
    base-backoff-seconds: 1
    max-backoff-seconds: 1
    connect-timeout-ms: 1000
    read-timeout-ms: 1000
    # 既有用例按"邮件同步外呼"断言结果；异步时效行为由 NotifyEmailAsyncTimingTest 单独开启验证
    email-async: false
    pending-first-delivery-seconds: 3

logging:
  level:
    com.evops: WARN
